[project]
name = "ledgerlouis"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "django>=5.2,<6",
    "django-cors-headers>=4.9.0",
    "django-environ>=0.14.0",
    "djangorestframework>=3.18.3",
    "fastmcp==4.1.4",
    "feedparser>=6.0.14",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.6",
    "yfinance>=1.7.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-django>=4.14.0",
    "respx>=0.23.1",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["."]
