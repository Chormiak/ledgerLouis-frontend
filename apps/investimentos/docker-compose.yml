services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ledgerlouis
      POSTGRES_PASSWORD: ledgerlouis # só para uso local; troque se expor a porta fora do seu PC
      POSTGRES_DB: ledgerlouis
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7
    ports: ["127.0.0.1:6379:6379"]

volumes:
  pgdata:
